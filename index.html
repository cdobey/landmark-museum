<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landmark Museum</title>
    <link rel="stylesheet" href="./src/style.css">
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <p style="font-size:36px">
          Landmark Museum
        </p>
        <p>
          Move: WASD<br/>
          Jump: SPACE<br/>
          Look: MOUSE
        </p>
        
        <div id="api-key-section">
          <h3>AI API Key</h3>
          <p class="api-note">Use your own key or try 3 free searches.</p>
          <div id="api-provider-row">
            <label for="api-provider-select">Provider</label>
            <select id="api-provider-select">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="google">Google</option>
            </select>
          </div>
          <div id="api-input-container">
            <input type="password" id="api-key-input" placeholder="Enter your API key..." />
            <button id="validate-key-btn" class="normbutton">Save</button>
          </div>
          <div id="api-status"></div>
          <button id="free-trial-btn" class="normbutton secondary">Try for free (3 searches)</button>
        </div>
        
        <button id="enter-museum-btn" class="enter-button" disabled>Enter Museum</button>
      </div>
    </div>

    <div id="free-search-counter"></div>

    <!-- 3D Search Overlay -->
    <div id="search-overlay">
        <div id="search-overlay-content">
            <button id="search-overlay-close">&times;</button>
            <h2>Search for a Country</h2>
            <p>Enter a country name to explore its famous landmarks</p>
            <div id="search-overlay-input-area">
                <input type="text" id="search-input-field" placeholder="e.g., France, Japan, Egypt..." />
                <button id="search-overlay-submit" class="normbutton">Search</button>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading-indicator">
        <div class="spinner"></div>
        <p>Loading landmarks...</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
